services:
  lpic1:
    build: .
    image: lpic1-trainer:latest
    container_name: lpic1-trainer
    ports:
      - "127.0.0.1:8080:8080"   # only reachable from this PC; use "8080:8080" to share in your LAN
    volumes:
      - lpic1-data:/data        # SQLite database with your progress + sandbox
    restart: unless-stopped

volumes:
  lpic1-data:
